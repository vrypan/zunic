name: CI

on:
  push:

# Supersede in-flight runs for the same ref, so a burst of pushes does not
# queue ten jobs apiece. The ref is part of the group, so branches and tags
# never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }} / ${{ matrix.wrap_fast_path }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is x86_64; macos-14 is arm64. Both architectures run
        # every wrap-fast-path backend so the SIMD kernel is exercised on
        # actual hardware rather than only on the maintainer's machine.
        os: [ubuntu-latest, macos-14]
        wrap_fast_path: ["off", "scalar", "auto", "simd"]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig build test
        run: zig build test -Dwrap-fast-path=${{ matrix.wrap_fast_path }} --summary all

      - name: zig build test (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast -Dwrap-fast-path=${{ matrix.wrap_fast_path }} --summary all

  benchmark-smoke:
    name: benchmark smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Throughput numbers are not comparable across runners; this only checks
      # that the benchmark still builds and runs on both architectures.
      - name: zig build benchmark -- --smoke
        run: zig build benchmark -Doptimize=ReleaseFast -- --smoke
