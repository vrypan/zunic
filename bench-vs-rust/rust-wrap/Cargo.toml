[package]
name = "cellwidth-wrap-bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "cellwidth-wrap-bench"
path = "src/main.rs"

[features]
# Historical comparison retained for explicit manual use only.
cellwidth-bench = ["dep:cellwidth"]

[dependencies]
cellwidth = { version = "=1.0.1", optional = true }
textwrap = "=0.16.2"

[profile.release]
lto = true
codegen-units = 1
